[package]
name = "creatorlauncher"
version = "0.1.0"
description = "Creator Launcher for Minecraft"
authors = ["Nikita"]
edition = "2021"

[lib]
name = "creatorlauncher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
